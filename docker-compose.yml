services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlgpt
      POSTGRES_PASSWORD: mlgpt
      POSTGRES_DB: mlgpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlgpt"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mlgpt:mlgpt@db:5432/mlgpt
      DRIFT_CHECK_INTERVAL_SECONDS: "60"
      PSI_THRESHOLD: "0.2"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
